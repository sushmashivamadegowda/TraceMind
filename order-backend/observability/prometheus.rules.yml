groups:
  - name: order-backend-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_errors_total[1m])) / sum(rate(http_requests_total[1m])) > 0.1
        for: 10s
        labels:
          severity: high
          job: order-api
        annotations:
          summary: "High 500 error rate detected"
          description: "500 error rate > 10% over the last minute."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 2.0
        for: 10s
        labels:
          severity: high
          job: order-api
        annotations:
          summary: "High API latency"
          description: "95th percentile latency > 2 seconds."
